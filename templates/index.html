<!DOCTYPE html>
<html>
<head>
    <title>TrustLens</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            margin:0;
            font-family:"Outfit",sans-serif;
            background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:rgba(15,23,42,0.75);
            backdrop-filter:blur(18px);
            border-radius:20px;
            padding:45px;
            width:650px;
            box-shadow:0px 15px 45px rgba(0,0,0,0.45);
        }

        /* ---------- HERO HEADING ---------- */

        .hero{
            text-align:center;
            margin-bottom:28px;
        }

        .badge-ai{
            display:inline-block;
            padding:6px 14px;
            border-radius:20px;
            font-size:12px;
            background:rgba(99,102,241,0.15);
            color:#a5b4fc;
            margin-bottom:10px;
            border:1px solid rgba(99,102,241,0.25);
        }

        .logo{
            font-size:48px;
            font-weight:700;
            letter-spacing:0.5px;
            color:white;
            margin:10px 0;
            text-shadow:0px 0px 18px rgba(99,102,241,0.25);
        }

        .subtitle{
            color:#94a3b8;
            font-size:15px;
        }

        .line{
            width:80px;
            height:3px;
            margin:14px auto 0;
            border-radius:4px;
            background:linear-gradient(90deg,#6366f1,#a855f7);
            animation:glow 3s infinite ease-in-out;
        }

        @keyframes glow{
            0%{opacity:0.5;transform:scaleX(0.7);}
            50%{opacity:1;transform:scaleX(1);}
            100%{opacity:0.5;transform:scaleX(0.7);}
        }

        /* ---------- INPUT ---------- */

        textarea{
            width:100%;
            height:120px;
            border-radius:12px;
            border:none;
            padding:14px;
            background:#020617;
            color:white;
            outline:none;
            margin-top:20px;
            resize:none;
        }

        button{
            width:100%;
            padding:14px;
            border-radius:12px;
            border:none;
            margin-top:16px;
            background:linear-gradient(90deg,#6366f1,#8b5cf6);
            color:white;
            font-weight:600;
            font-size:15px;
            cursor:pointer;
        }

        button:hover{
            opacity:0.9;
        }

        /* ---------- RESULT ---------- */

        .result{
            margin-top:28px;
            text-align:center;
        }

        .badge{
            display:inline-block;
            padding:8px 18px;
            border-radius:30px;
            font-weight:600;
            margin-bottom:15px;
        }

        .real{
            background:rgba(34,197,94,0.15);
            color:#22c55e;
        }

        .fake{
            background:rgba(239,68,68,0.18);
            color:#ef4444;
        }

        .score{
            margin-top:6px;
            font-size:16px;
        }

        .bar{
            width:100%;
            height:10px;
            background:#1e293b;
            border-radius:10px;
            overflow:hidden;
            margin:15px 0;
        }

        .fill{
            height:100%;
            background:linear-gradient(90deg,#6366f1,#a855f7);
        }

        .explain{
            margin-top:20px;
            font-size:14px;
            color:#cbd5f5;
            line-height:1.6;
            text-align:left;
        }

        .footer{
            text-align:center;
            margin-top:25px;
            color:#64748b;
            font-size:12px;
        }

    </style>
</head>

<body>

<div class="card">

    <div class="hero">
        <div class="badge-ai">AI Credibility Engine</div>
        <h1 class="logo">TrustLens</h1>
        <div class="subtitle">Automated News Credibility System</div>
        <div class="line"></div>
    </div>

    <form method="POST">
        <textarea name="news" placeholder="Paste news article here...">{{ news_text }}</textarea>

        <button type="submit">Analyze News</button>
    </form>

    {% if result %}
    <div class="result">

        <div class="badge {{ 'real' if 'Real' in result else 'fake' }}">
            {{ result }}
        </div>

        <div class="score">
            Credibility Score: {{ score }}%
        </div>

        <div class="bar">
            <div class="fill" style="width: {{ score }}%"></div>
        </div>

        <div class="explain">
            <strong>Why this result?</strong><br>
            {{ explanation }}
        </div>

    </div>
    {% endif %}

    <div class="footer">
        TrustLens • FY Research Prototype
    </div>

</div>

</body>
</html>
