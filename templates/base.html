<!DOCTYPE html>
<html>
<head>
<title>TrustLens AI Platform</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family:'Segoe UI',sans-serif;
    background:#0f172a;
    color:white;
    display:flex;
    height:100vh;
    overflow:hidden;
}

/* PARTICLE CANVAS */
#particles {
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
    background:radial-gradient(circle at 30% 30%, #1e293b, #0f172a 60%);
}

/* SIDEBAR */

.sidebar {
    width:260px;
    background:linear-gradient(180deg,#1e1b4b,#0f172a);
    padding:30px 20px;
    overflow-y:auto;
    border-right:1px solid rgba(255,255,255,0.08);
}

.logo {
    font-size:26px;
    font-weight:700;
    margin-bottom:35px;
    background:linear-gradient(90deg,#a855f7,#22d3ee);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.section-title {
    font-size:11px;
    opacity:0.5;
    margin:20px 0 10px;
    text-transform:uppercase;
}

.sidebar a {
    display:block;
    padding:10px 14px;
    margin-bottom:8px;
    border-radius:12px;
    text-decoration:none;
    color:#cbd5e1;
    font-size:14px;
    transition:0.3s;
}

.sidebar a:hover {
    background:rgba(168,85,247,0.2);
    transform:translateX(5px);
}

/* MAIN */

.main {
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar {
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 40px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.content {
    padding:60px;
    overflow-y:auto;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="sidebar">
    <div class="logo">TrustLens</div>

    <div class="section-title">Core</div>
    <a href="/">🏠 Dashboard</a>
    <a href="/analyze">🧠 Analyze Article</a>
    <a href="#">📜 History</a>

    <div class="section-title">Intelligence Modules</div>
    <a href="#">⚖ Bias Detection</a>
    <a href="#">🏷 Topic Classification</a>
    <a href="#">🔎 Headline Consistency</a>
    <a href="#">🤖 AI Detection</a>

    <div class="section-title">Analytics</div>
    <a href="#">📊 Statistics</a>
    <a href="#">📈 Trends</a>

    <div class="section-title">System</div>
    <a href="#">⚙ Settings</a>
    <a href="#">🔗 API Access</a>
</div>

<div class="main">
    <div class="topbar">
        <div>AI Content Intelligence Platform</div>
        
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</div>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        dx: (Math.random() - 0.5) * 0.5,
        dy: (Math.random() - 0.5) * 0.5
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(168,85,247,0.6)";
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
