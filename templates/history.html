{% extends "base.html" %}
{% block title %}History{% endblock %}
{% block page_title %}History{% endblock %}
{% block content %}
<section class="page-header"><h1>Session History</h1><p>Saved only in this browser session. Closing the browser or clearing site data removes it.</p></section>
<div class="panel" style="margin-bottom:18px"><button class="secondary-button" id="export">Export CSV</button> <button class="secondary-button" id="clear">Clear session history</button></div>
<div class="panel"><div id="history-list"></div></div>
{% endblock %}
{% block scripts %}<script>
function renderHistory() { const records = trustLensRecords(); const list = document.getElementById('history-list'); list.innerHTML = records.length ? records.map(row => `<div style="padding:14px 0;border-bottom:1px solid var(--line)"><strong>${escapeHtml(row.topic || 'General')}</strong> · Trust ${row.trust_score}% · Bias ${Math.round(row.bias_score)}% · AI ${Math.round(row.ai_probability)}% · <strong>${escapeHtml(row.risk_level)}</strong><br><small>${sessionDate(row.timestamp)} — ${escapeHtml((row.article_text || '').slice(0,180))}</small></div>`).join('') : '<div class="empty-state"><h3>No analyses in this session</h3><p>Analyze an article to create session history.</p><a class="primary-button" href="/analyze">Analyze Article</a></div>'; }
document.getElementById('clear').onclick = () => { if (confirm('Clear all analyses from this browser session?')) { clearTrustLensRecords(); renderHistory(); } };
document.getElementById('export').onclick = () => { const fields = ['date','article','topic','trust_score','bias_score','ai_probability','risk_level']; const rows = trustLensRecords().map(row => [row.timestamp,row.article_text,row.topic,row.trust_score,row.bias_score,row.ai_probability,row.risk_level]); const csv = [fields,...rows].map(row => row.map(value => `"${String(value ?? '').replaceAll('"','""')}"`).join(',')).join('\n'); const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); link.download='trustlens_session_history.csv'; link.click(); };
renderHistory();
</script>{% endblock %}
