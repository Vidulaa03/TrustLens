{% extends "base.html" %}
{% block title %}Compare Articles{% endblock %}
{% block page_title %}Compare Articles{% endblock %}
{% block content %}
<section class="page-header"><h1>Compare Articles</h1><p>Compare two analyses saved in this browser session.</p></section>
<div class="panel" style="max-width:900px"><div class="grid-2"><select id="articleA"></select><select id="articleB"></select></div><button class="primary-button" id="compareButton" style="margin-top:16px">Compare</button></div><div id="comparison" style="margin-top:20px"></div>
{% endblock %}
{% block scripts %}<script>
const records = trustLensRecords(); const options = records.map((row, index) => `<option value="${index}">${index + 1}. ${escapeHtml((row.article_text || 'Article').slice(0,70))}</option>`).join('');
document.getElementById('articleA').innerHTML = options || '<option>No session analyses available</option>'; document.getElementById('articleB').innerHTML = options || '<option>No session analyses available</option>';
if (records.length > 1) document.getElementById('articleB').selectedIndex = 1;
document.getElementById('compareButton').onclick = () => { const a=records[articleA.value], b=records[articleB.value]; if (!a || !b || a===b) { alert('Select two different analyses.'); return; } const rows=[['Trust score','trust_score'],['Bias score','bias_score'],['AI-writing likelihood','ai_probability'],['Risk level','risk_level'],['Topic','topic']]; comparison.innerHTML=`<div class="panel"><h3>Comparison</h3><table style="width:100%;border-collapse:collapse"><thead><tr><th>Signal</th><th>Article A</th><th>Article B</th></tr></thead><tbody>${rows.map(([label,key])=>`<tr><td style="padding:10px;border-top:1px solid var(--line)">${label}</td><td style="padding:10px;border-top:1px solid var(--line)">${escapeHtml(a[key])}${key.includes('score')||key==='ai_probability'?'%':''}</td><td style="padding:10px;border-top:1px solid var(--line)">${escapeHtml(b[key])}${key.includes('score')||key==='ai_probability'?'%':''}</td></tr>`).join('')}</tbody></table></div>`; };
</script>{% endblock %}
