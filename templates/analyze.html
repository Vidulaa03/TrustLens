{% extends "base.html" %}
{% block content %}

<div style="background:rgba(255,255,255,0.06); padding:30px; border-radius:20px;">

<form method="POST">
<textarea name="news" style="width:100%; height:180px; padding:15px; background:#0f172a; color:white;" required>{{ news_text }}</textarea>
<br>
<button type="submit" style="margin-top:20px; padding:12px 35px; background:linear-gradient(90deg,#8b5cf6,#6366f1,#22d3ee); border:none; border-radius:30px; color:white;">
Analyze Article
</button>
</form>

</div>

{% if analysis %}
<div style="margin-top:30px; background:rgba(255,255,255,0.06); padding:30px; border-radius:20px;">

<h2>{{ analysis.label }}</h2>
<p>Trust Score: {{ analysis.trust_score }}%</p>
<p>Emotional Intensity: {{ analysis.emotional_score }}%</p>
<p>Clickbait Score: {{ analysis.clickbait_score }}%</p>

</div>
{% endif %}

{% endblock %}
